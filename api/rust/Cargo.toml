[package]
name = "deps"
version = "1.0.9"
edition = "2024"
license = "MIT"

[dependencies]
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
pbs = { git = "https://github.com/mark-ahn/pbs", version = "0.1.2", features = [
	"pub-deps",
] }
anyhow = { version = "1.0.104", default-features = false }
tracing = { version = "0.1.44", default-features = false }

pbjson = { version = "0.9.0", optional = true }

serde = { version = "1.0.229", default-features = false, features = [
	"derive",
], optional = true }
derive_more = { version = "2.1.1", default-features = false, features = [
	"from",
] }
uuid = { version = "1.29.0", default-features = false, features = [
	"v4",
], optional = true }
itertools = { version = "0.15.0", default-features = false, features = [
	"use_alloc",
] }


[build-dependencies]
prost-build = "0.14.4"
pbjson-build = "0.9.0"
glob = "0.3.4"

[dev-dependencies]
serde_json = "1.0.154"
test-log = { version = "0.2.21", default-features = false, features = [
	"color",
	"trace",
] }
tracing = { version = "0.1.44", default-features = false }


[features]
std = ["dep:uuid"]

serde = ["dep:serde"]
serde-json = ["dep:pbjson", "dep:serde", "std", "pbs/serde-json"]
tracing-log = []
pub-deps = []
