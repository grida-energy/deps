syntax = "proto3";

package deps.model.hvac.rpc.v1;

import "deps/model/hvac/v1/model.proto";
import "google/protobuf/timestamp.proto";

option java_package = "io.github.grida_energy.deps.model.hvac.rpc.v1";

message MeasureResponse {
  google.protobuf.Timestamp timestamp = 1;
  deps.model.hvac.v1.Hvac payload = 2;
}
