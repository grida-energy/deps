syntax = "proto3";

package deps.model.safety.v1;

option java_package = "io.github.grida_energy.deps.model.safety.v1";

message ImdMeasurement {
  float kohm_ir = 1;
}

message Safety {
  enum St {
    ST_UNSPECIFIED = 0;
  }
  message Status {
    bool other = 1;
  }
  message Fault {
    bool other = 1;
  }
  message Warning {
    bool other = 1;
  }

  St st = 1;
  Status status = 2;
  Fault fault = 3;
  Warning warning = 4;

  ImdMeasurement imd = 5;
}
